################################################################################
# Persistent Volume Claim (PVC) — Ollama
# ------------------------------------------------------------------------------
# This PVC provides persistent storage for model data (/data/models).
# Ensures model availability across pod restarts and node re-scheduling.
################################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ollama.fullname" . }}-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "10Gi" }}
  storageClassName: {{ .Values.persistence.storageClass | default "gp3-csi" }} # gp3-csi class is optimal for AWS EKS environments.
                                                                                #In other cloud providers, this can be overridden via Helm values.
