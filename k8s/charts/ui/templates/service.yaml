################################################################################
# Service — Open WebUI
# ------------------------------------------------------------------------------
# Internal service exposing the WebUI to the cluster or Ingress controller.
################################################################################
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openwebui.fullname" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "openwebui.name" . }}
  ports:
    - port: 80
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  type: ClusterIP
